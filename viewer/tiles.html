<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOD3 の 3D Tiles 確認</title>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  html, body, #c { margin: 0; width: 100%; height: 100%; background: #1d1f22; }
  #note { position: absolute; top: 8px; left: 8px; z-index: 10; background: rgba(255,255,255,.92); color: #222;
          font: 13px/1.5 "Yu Gothic", "Meiryo", sans-serif; padding: 8px 10px; border-radius: 6px; max-width: 420px; }
</style>
</head>
<body>
<div id="note">PLATEAU 公式の変換ツール（PLATEAU GIS Converter のコマンド版 nusamai 0.1.14）で、書き出した LOD3 の CityGML を 3D Tiles にしたものを、CesiumJS（PLATEAU VIEW の土台）で表示しています（地面は無地）。<br><span id="st">読み込み中…</span></div>
<div id="c"></div>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Cesium.js"></script>
<script>
(async () => {
  const st = document.getElementById("st");
  try {
    const viewer = new Cesium.Viewer("c", {
      baseLayer: false, baseLayerPicker: false, geocoder: false, timeline: false, animation: false, homeButton: false,
      sceneModePicker: false, navigationHelpButton: false, infoBox: true, selectionIndicator: true,
    });
    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#d8d8d2");     // 地図の画像は使わず、地面を淡い灰色に
    viewer.scene.skyAtmosphere.show = true;
    viewer.scene.globe.depthTestAgainstTerrain = false;
    const ts = await Cesium.Cesium3DTileset.fromUrl("../out/lod3_converted/3dtiles/tileset.json");
    viewer.scene.primitives.add(ts);
    await viewer.zoomTo(ts, new Cesium.HeadingPitchRange(Cesium.Math.toRadians(20), Cesium.Math.toRadians(-25), 260));
    st.textContent = "読み込みました。建物をクリックすると、変換で残った属性が出ます。";
    window.__tileset = ts;
  } catch (e) {
    st.textContent = "読み込めませんでした：" + e;
    console.error(e);
  }
})();
</script>
</body>
</html>
