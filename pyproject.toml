[project]
name = "plateau-recorder"
version = "0.1.0"
description = "スマホの写真から、値ごとの確かさ（σ）と根拠を持つ PLATEAU 仕様の LOD3 を作る道具（campus-recorder から派生）"
requires-python = ">=3.13"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]
agents = ["claude-agent-sdk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "browser: headless の Edge / Chrome を起動する。CI では外す",
    "gpu: torch・学習済みの重み（Depth Pro・ALIKED/LightGlue・GeoCalib）が要る。CI では外す",
]
